[package]
name = "fpv-app"
description = "FPV Rush: the native Rust desktop library and video player."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fpv-rush"
path = "src/main.rs"

[dependencies]
env_logger.workspace = true
fpv-export.workspace = true
fpv-library.workspace = true
fpv-media.workspace = true
fpv-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
cpal = "0.16"

[dev-dependencies]
tempfile.workspace = true
