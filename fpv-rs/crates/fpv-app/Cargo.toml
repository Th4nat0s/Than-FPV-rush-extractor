[package]
name = "fpv-app"
description = "FPV Rush: the desktop app, a Tauri shell over fpv-library."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fpv-rush"
path = "src/main.rs"

[dependencies]
env_logger.workspace = true
fpv-export.workspace = true
fpv-import.workspace = true
fpv-library.workspace = true
fpv-pipeline.workspace = true
log.workspace = true
serde.workspace = true
uuid.workspace = true
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
