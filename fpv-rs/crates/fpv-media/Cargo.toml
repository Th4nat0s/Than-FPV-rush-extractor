[package]
name = "fpv-media"
description = "The ffmpeg/ffprobe boundary: running the tools, probing, frames, thumbnails."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
fpv-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true

# Asking the system to free a cloud placeholder's space (`cloud::free_up_space`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
